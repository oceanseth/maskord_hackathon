name: Terraform

on:
  workflow_dispatch:

jobs:
  terraform:
    name: Terraform Plan & Apply
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.7"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            us-east-1

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -no-color -out=tfplan
        env:
          TF_VAR_domain_name:        maskord.com
          TF_VAR_s3_bucket_name:     ${{ vars.S3_BUCKET }}
          TF_VAR_environment:        production
          TF_VAR_turn_password:      ${{ secrets.TURN_PASSWORD }}
          TF_VAR_turn_ssh_public_key: ${{ secrets.TURN_SSH_PUBLIC_KEY }}

      # Only apply on push to production or manual dispatch on production (not on PRs)
      - name: Terraform Apply
        if: github.ref == 'refs/heads/production' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: terraform apply -auto-approve tfplan
