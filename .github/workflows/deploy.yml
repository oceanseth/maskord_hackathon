name: Deploy Website

on:
  push:
    branches:
      - production
    paths:
      - 'www/**'
      - 'scripts/deploy.sh'
      - '.github/workflows/deploy.yml'

  # Allow manual trigger from GitHub Actions UI
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy to S3 + CloudFront
    runs-on: ubuntu-latest
    environment: production

    permissions:
      contents: read
      id-token: write  # For OIDC auth (optional, see below)

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: www/package-lock.json

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Build & Deploy
        env:
          S3_BUCKET:          ${{ vars.S3_BUCKET }}
          CF_DISTRIBUTION_ID: ${{ vars.CF_DISTRIBUTION_ID }}
          AWS_REGION:         ${{ vars.AWS_REGION || 'us-east-1' }}
          # Firebase config for the website build
          VITE_FIREBASE_API_KEY:             ${{ secrets.FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN:         ${{ vars.FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_DATABASE_URL:        ${{ vars.FIREBASE_DATABASE_URL }}
          VITE_FIREBASE_PROJECT_ID:          ${{ vars.FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET:      ${{ vars.FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID:              ${{ secrets.FIREBASE_APP_ID }}
        run: bash scripts/deploy.sh

      - name: Post deploy summary
        run: |
          echo "### ✅ Maskord Website Deployed" >> $GITHUB_STEP_SUMMARY
          echo "- **URL**: https://maskord.com" >> $GITHUB_STEP_SUMMARY
          echo "- **Bucket**: \`${{ vars.S3_BUCKET }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **CloudFront**: \`${{ vars.CF_DISTRIBUTION_ID }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
