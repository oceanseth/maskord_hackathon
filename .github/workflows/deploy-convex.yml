name: Deploy to Convex

# Pushing to main publishes the site to the prod Convex deployment, which is
# what hackathon.maskord.com serves. Nothing here touches maskord.com — see
# .github/workflows/README.md for why the upstream workflows were removed.

on:
  push:
    branches: [main]
    paths:
      - 'www/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-convex.yml'
  workflow_dispatch:

# Never let two deploys race for the same production deployment.
concurrency:
  group: convex-prod
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and publish
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      # The build is run explicitly rather than via `upload --build`: that flag
      # runs vite itself and skips www's build script, which is what folds the
      # Maskord client into dist/app.
      - name: Deploy backend and publish site
        working-directory: www
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: |
          npx convex deploy
          npm run build
          npx @convex-dev/static-hosting upload --prod -d ./dist

      - name: Summary
        run: |
          echo "### Deployed" >> $GITHUB_STEP_SUMMARY
          echo "- https://hackathon.maskord.com" >> $GITHUB_STEP_SUMMARY
          echo "- https://impressive-skunk-614.convex.site (Convex origin)" >> $GITHUB_STEP_SUMMARY
          echo "- Commit \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
